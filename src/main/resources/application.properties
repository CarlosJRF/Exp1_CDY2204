spring.application.name=eventos
server.port=8080

# Valores tomados de variables de entorno (con defaults para desarrollo local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventos}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate crea/actualiza las tablas automaticamente a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Carpeta donde esta montado el EFS (dentro del contenedor) y bucket S3 de tickets
app.efs.path=${EFS_PATH:./efs}
app.s3.bucket=${S3_BUCKET:}
app.aws.region=${AWS_REGION:us-east-1}
