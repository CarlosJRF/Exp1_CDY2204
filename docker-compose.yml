services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: eventos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    image: ${DOCKERHUB_USERNAME:-local}/eventos:latest
    build: .
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    volumes:
      # En la EC2 EFS_HOST_PATH=/home/ec2-user/efs (punto de montaje del EFS); en local, carpeta ./efs
      - ${EFS_HOST_PATH:-./efs}:/app/efs
    environment:
      DB_URL: jdbc:postgresql://db:5432/eventos
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      EFS_PATH: /app/efs
      S3_BUCKET: ${S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # Solo para pruebas locales con credenciales del Learner Lab; en la EC2 quedan vacias y se usa el rol
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}

volumes:
  pgdata:
