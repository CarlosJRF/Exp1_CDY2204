services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: eventos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    image: ${DOCKERHUB_USERNAME:-local}/eventos:latest
    build: .
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/eventos
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}

volumes:
  pgdata:
