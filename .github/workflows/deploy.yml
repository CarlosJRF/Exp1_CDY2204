name: Build y Deploy a EC2

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/eventos:latest

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copiar docker-compose.yml a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml
          target: eventos

      - name: Desplegar en EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          EFS_ID: ${{ secrets.EFS_ID }}
          EFS_HOST_PATH: /mnt/efs
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DB_PASSWORD,S3_BUCKET,EFS_ID,EFS_HOST_PATH,AWS_REGION
          script: |
            set -e
            # Montar el EFS (solo si aun no esta montado, ej. tras reiniciar el laboratorio)
            # Cliente NFS: nfs-common en Ubuntu, nfs-utils en Amazon Linux
            if ! command -v mount.nfs4 >/dev/null 2>&1; then
              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update -q && sudo apt-get install -y -q nfs-common
              else
                sudo dnf install -y -q nfs-utils
              fi
            fi
            sudo mkdir -p $EFS_HOST_PATH
            mountpoint -q $EFS_HOST_PATH || sudo mount -t nfs4 \
              -o nfsvers=4.1,rsize=1048576,wsize=1048576,hard,timeo=600,retrans=2,noresvport \
              $EFS_ID.efs.$AWS_REGION.amazonaws.com:/ $EFS_HOST_PATH
            sudo mkdir -p $EFS_HOST_PATH/tickets

            # Instalar Docker y el plugin compose (solo si faltan)
            if ! command -v docker >/dev/null 2>&1; then
              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update -q && sudo apt-get install -y -q docker.io
              else
                sudo dnf install -y -q docker
              fi
              sudo systemctl enable --now docker
              sudo usermod -aG docker $USER
            fi
            if ! sudo docker compose version >/dev/null 2>&1; then
              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get install -y -q docker-compose-v2
              else
                sudo mkdir -p /usr/local/lib/docker/cli-plugins
                sudo curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-compose \
                  https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m)
                sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
              fi
            fi

            # sudo -E: el grupo docker recien agregado no aplica en esta sesion; -E conserva las variables
            cd ~/eventos
            sudo -E docker compose pull app
            sudo -E docker compose up -d --no-build
            sudo docker image prune -f
