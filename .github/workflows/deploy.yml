name: Build y Deploy a EC2

on:
  push:
    branches: [Exp2]

env:
  AWS_REGION: us-east-1

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/eventos:latest

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copiar docker-compose.yml a EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml
          target: eventos

      - name: Desplegar en EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DB_PASSWORD,S3_BUCKET,AWS_REGION
          script: |
            set -e
            # Instalar Docker y el plugin compose (solo si faltan)
            if ! command -v docker >/dev/null 2>&1; then
              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get update -q && sudo apt-get install -y -q docker.io
              else
                sudo dnf install -y -q docker
              fi
              sudo systemctl enable --now docker
              sudo usermod -aG docker $USER
            fi
            if ! sudo docker compose version >/dev/null 2>&1; then
              if command -v apt-get >/dev/null 2>&1; then
                sudo apt-get install -y -q docker-compose-v2
              else
                sudo mkdir -p /usr/local/lib/docker/cli-plugins
                sudo curl -fsSL -o /usr/local/lib/docker/cli-plugins/docker-compose \
                  https://github.com/docker/compose/releases/latest/download/docker-compose-linux-$(uname -m)
                sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
              fi
            fi

            # Variables para docker compose en un archivo .env (sudo-rs de Ubuntu 26.04 ignora "sudo -E")
            cd ~/eventos
            umask 077
            printf 'DOCKERHUB_USERNAME=%s\nDB_PASSWORD=%s\nS3_BUCKET=%s\nAWS_REGION=%s\n' \
              "$DOCKERHUB_USERNAME" "$DB_PASSWORD" "$S3_BUCKET" "$AWS_REGION" > .env

            # sudo: el grupo docker recien agregado no aplica en esta sesion
            sudo docker compose pull app
            # Reinicia la BD en cada despliegue (borra el volumen pgdata); los PDF antiguos quedan en S3
            sudo docker compose down -v
            sudo docker compose up -d --no-build
            sudo docker image prune -f
